name: Issue 21 control contract validation

on:
  push:
    branches: [codex/issue21-control-validation]

permissions:
  contents: read

jobs:
  control-contract:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -e . pytest==8.4.2
      - name: Restore native test project
        run: dotnet restore tests/ControlReplay/ControlReplay.csproj
      - name: Run original native action contract test
        run: python -m pytest tests/test_control.py::test_native_action_contract_matches_model_codec -v --junitxml=control-contract.xml
      - name: Preserve test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-contract-result
          path: control-contract.xml
          if-no-files-found: error

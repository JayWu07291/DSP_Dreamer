[project]
name = "dsp-dreamer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "zarr==3.1.2", "pyarrow==21.0.0"]

[project.scripts]
dsp-dreamer = "dsp_dreamer.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

